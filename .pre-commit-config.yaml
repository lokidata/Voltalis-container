repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: lint-format
        name: eslint + prettier
        entry: sh -c 'npm run lint && npm run format:check'
        language: system
        pass_filenames: false
